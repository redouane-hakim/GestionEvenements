<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Événements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Événements</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/admin}">Retour</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
      <tr><th>ID</th><th>Titre</th><th>Lieu</th><th>Dates</th><th>Organisateur</th></tr>
      </thead>
      <tbody>
      <tr th:each="e : ${events}">
        <td th:text="${e.eid}"></td>
        <td><a th:href="@{/events/{id}(id=${e.eid})}" th:text="${e.titre}"></a></td>
        <td th:text="${e.lieu}"></td>
        <td class="small">
          <div>Début: <span th:text="${e.dateDebut}"></span></div>
          <div>Fin: <span th:text="${e.dateFin}"></span></div>
        </td>
        <td class="small" th:text="${e.organisateur != null ? e.organisateur.email : '—'}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
