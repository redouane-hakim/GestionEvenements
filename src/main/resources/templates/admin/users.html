<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Utilisateurs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Utilisateurs</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/admin}">Retour</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
      <tr><th>ID</th><th>Nom</th><th>Email</th><th>Téléphone</th><th>Rôle</th><th>Signature</th></tr>
      </thead>
      <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.uid}"></td>
        <td th:text="${u.nom} + ' ' + ${u.prenom}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.telephone}"></td>
        <td><span class="badge bg-dark" th:text="${u.role}"></span></td>
        <td><a th:if="${u.signatureImageUrl != null}" th:href="${u.signatureImageUrl}" target="_blank">lien</a><span th:if="${u.signatureImageUrl == null}">—</span></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
