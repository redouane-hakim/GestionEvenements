<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Dashboard Admin</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary btn-scale" th:href="@{/admin/demandes}">Demandes</a>
      <a class="btn btn-outline-primary btn-scale" th:href="@{/admin/events}">Événements</a>
      <a class="btn btn-outline-primary btn-scale" th:href="@{/admin/users}">Utilisateurs</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="p-4 border rounded-4">
        <div class="text-muted small">Utilisateurs</div>
        <div class="display-6 fw-bold" th:text="${usersCount}">0</div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="p-4 hero">
        <div class="fw-bold">Gestion des demandes</div>
      </div>
    </div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div class="fw-bold">Dernières demandes</div>
            <a th:href="@{/admin/demandes}" class="small">Voir tout</a>
          </div>
          <div class="table-responsive mt-3">
            <table class="table table-sm align-middle">
              <thead>
              <tr><th>ID</th><th>Intitulé</th><th>Statut</th></tr>
              </thead>
              <tbody>
              <tr th:each="d : ${demandes}">
                <td th:text="${d.did}"></td>
                <td th:text="${d.intitule}"></td>
                <td><span class="badge bg-secondary" th:text="${d.status}"></span></td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div class="fw-bold">Derniers événements</div>
            <a th:href="@{/admin/events}" class="small">Voir tout</a>
          </div>
          <div class="table-responsive mt-3">
            <table class="table table-sm align-middle">
              <thead>
              <tr><th>ID</th><th>Titre</th><th>Lieu</th></tr>
              </thead>
              <tbody>
              <tr th:each="e : ${events}">
                <td th:text="${e.eid}"></td>
                <td th:text="${e.titre}"></td>
                <td th:text="${e.lieu}"></td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
