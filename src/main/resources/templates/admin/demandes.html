<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Demandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Gestion des demandes</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/admin}">Retour</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
      <tr>
        <th>ID</th><th>Organisateur</th><th>Intitulé</th><th>Organisation</th><th>Statut</th><th>Traçabilité</th><th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="d : ${demandes}">
        <td th:text="${d.did}"></td>
        <td>
          <div class="fw-semibold" th:text="${d.nomOrganisateur} + ' ' + ${d.prenomOrganisateur}"></div>
          <div class="small text-muted" th:text="${d.emailOrganisateur}"></div>
        </td>
        <td th:text="${d.intitule}"></td>
        <td th:text="${d.nomOrganisation}"></td>
        <td>
          <span class="badge bg-warning text-dark" th:if="${d.status.name()=='EN_ATTENTE'}">EN_ATTENTE</span>
          <span class="badge bg-success" th:if="${d.status.name()=='ACCEPTEE'}">ACCEPTEE</span>
          <span class="badge bg-danger" th:if="${d.status.name()=='REFUSEE'}">REFUSEE</span>
        </td>
        <td class="small">
          <div>Demande: <span th:text="${d.dateDemande}"></span></div>
          <div th:if="${d.validateur != null}">
            Validateur: <span th:text="${d.validateur.email}"></span>
          </div>
          <div th:if="${d.dateValidation != null}">Validation: <span th:text="${d.dateValidation}"></span></div>
          <div th:if="${d.signatureOrganisateurImageUrl != null}">
            Signature: <a th:href="${d.signatureOrganisateurImageUrl}" target="_blank">lien</a>
          </div>
        </td>
        <td>
          <div class="d-flex gap-2" th:if="${d.status.name()=='EN_ATTENTE'}">
            <form th:action="@{/admin/demandes/{id}/accepter(id=${d.did})}" method="post">
              <button class="btn btn-success btn-sm btn-scale" type="submit">Accepter</button>
            </form>
            <form th:action="@{/admin/demandes/{id}/refuser(id=${d.did})}" method="post">
              <button class="btn btn-danger btn-sm btn-scale" type="submit">Refuser</button>
            </form>
          </div>
          <span class="small text-muted" th:if="${d.status.name()!='EN_ATTENTE'}">—</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
