<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login • Gestion Événements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5" style="max-width: 520px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-3">Connexion</h1>

      <div th:if="${param.error}" class="alert alert-danger">Email ou mot de passe incorrect.</div>
      <div th:if="${param.logout}" class="alert alert-success">Déconnecté.</div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="username" type="email" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input class="form-control" name="password" type="password" required/>
        </div>

        <button class="btn btn-primary btn-scale w-100" type="submit">Se connecter</button>

        <div class="small text-muted mt-3">
          Comptes démo :
          <ul class="mb-0">
            <li>Admin: admin@demo.com / admin123</li>
            <li>Organisateur: org@demo.com / org123</li>
          </ul>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
