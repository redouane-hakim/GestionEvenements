<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Organisateur • Participants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-0">Participants</h1>
      <div class="small text-muted">Événement: <span th:text="${event.titre}"></span></div>
    </div>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/organisateur/events}">Retour</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
      <tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Message</th><th>Date</th></tr>
      </thead>
      <tbody>
      <tr th:each="p : ${participants}">
        <td th:text="${p.nom} + ' ' + ${p.prenom}"></td>
        <td th:text="${p.email}"></td>
        <td th:text="${p.telephone}"></td>
        <td class="small" th:text="${#strings.abbreviate(p.message, 80)}"></td>
        <td class="small" th:text="${p.dateSoumission}"></td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="small text-muted" th:if="${#lists.isEmpty(participants)}">Aucun participant pour le moment.</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
