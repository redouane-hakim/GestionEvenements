<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Organisateur • Demande</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4" style="max-width: 860px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Demande d’autorisation d’événement</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/organisateur}">Retour</a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form th:action="@{/organisateur/demande}" method="post" th:object="${demande}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Organisation</label>
            <input class="form-control" th:field="*{nomOrganisation}" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Type d’événement</label>
            <input class="form-control" th:field="*{typeEvenement}" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Intitulé</label>
            <input class="form-control" th:field="*{intitule}" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="5" required></textarea>
          </div>
        </div>

        <button class="btn btn-primary btn-scale w-100 mt-4" type="submit">Envoyer la demande</button>
        <div class="small text-muted mt-2">
          La signature et vos informations organisateur sont automatiquement reprises depuis votre compte.
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
