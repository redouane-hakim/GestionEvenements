<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Organisateur • Modifier événement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4" style="max-width: 980px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Modifier l’événement</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/organisateur/events}">Retour</a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form th:action="@{/organisateur/events/{id}/edit(id=${event.eid})}"
            method="post"
            th:object="${event}"
            enctype="multipart/form-data">

        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Titre</label>
            <input class="form-control" th:field="*{titre}" required/>
          </div>

          <div class="col-md-4">
            <label class="form-label">Catégorie</label>
            <input class="form-control" th:field="*{categorie}"/>
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="6"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">Lieu</label>
            <input class="form-control" th:field="*{lieu}"/>
          </div>

          <div class="col-md-3">
            <label class="form-label">Date début</label>
            <input class="form-control" th:field="*{dateDebut}" placeholder="2026-01-20T09:00"/>
            <div class="small text-muted">Format: yyyy-MM-ddTHH:mm</div>
          </div>

          <div class="col-md-3">
            <label class="form-label">Date fin</label>
            <input class="form-control" th:field="*{dateFin}" placeholder="2026-01-20T12:00"/>
          </div>


          <div class="col-12" th:if="*{afficheUrl}">
            <label class="form-label">Affiche actuelle</label>
            <div>
              <img th:src="*{afficheUrl}" alt="Affiche" style="max-height:200px" class="img-fluid rounded"/>
            </div>
            <div class="small text-muted" th:text="*{afficheUrl}"></div>
          </div>


          <div class="col-12">
            <label class="form-label">Uploader une nouvelle affiche</label>
            <input class="form-control" type="file" name="afficheFile" accept="image/*"/>
            <div class="small text-muted">PNG/JPG/WEBP • laisse vide pour garder l’affiche actuelle</div>
          </div>
        </div>

        <button class="btn btn-primary btn-scale w-100 mt-4" type="submit">Enregistrer</button>
      </form>

    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
