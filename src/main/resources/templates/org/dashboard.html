<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Organisateur • Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Dashboard Organisateur</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary btn-scale" th:href="@{/organisateur/demande}">Nouvelle demande</a>
      <a class="btn btn-outline-primary btn-scale" th:href="@{/organisateur/demandes}">Mes demandes</a>
      <a class="btn btn-outline-primary btn-scale" th:href="@{/organisateur/events}">Mes événements</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div class="fw-bold">Mes demandes (traçabilité)</div>
            <a th:href="@{/organisateur/demandes}" class="small">Voir tout</a>
          </div>
          <div class="table-responsive mt-3">
            <table class="table table-sm align-middle">
              <thead><tr><th>ID</th><th>Intitulé</th><th>Statut</th></tr></thead>
              <tbody>
              <tr th:each="d : ${mesDemandes}">
                <td th:text="${d.did}"></td>
                <td th:text="${d.intitule}"></td>
                <td><span class="badge bg-secondary" th:text="${d.status}"></span></td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div class="fw-bold">Mes événements</div>
            <a th:href="@{/organisateur/events}" class="small">Voir tout</a>
          </div>
          <div class="table-responsive mt-3">
            <table class="table table-sm align-middle">
              <thead><tr><th>ID</th><th>Titre</th><th>Actions</th></tr></thead>
              <tbody>
              <tr th:each="e : ${mesEvents}">
                <td th:text="${e.eid}"></td>
                <td th:text="${e.titre}"></td>
                <td class="text-nowrap">
                  <a class="btn btn-sm btn-outline-primary btn-scale" th:href="@{/organisateur/events/{id}/edit(id=${e.eid})}">Modifier</a>
                  <a class="btn btn-sm btn-outline-dark btn-scale" th:href="@{/organisateur/events/{id}/participants(id=${e.eid})}">Participants</a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
