<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Organisateur • Mes événements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Mes événements</h1>
    <a class="btn btn-outline-secondary btn-scale" th:href="@{/organisateur}">Retour</a>
  </div>

  <div class="row g-3">
    <div class="col-md-6" th:each="e : ${events}">
      <div class="card card-hover h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <div>
              <div class="fw-bold" th:text="${e.titre}"></div>
              <div class="small text-muted">
                <span th:text="${e.lieu} ?: 'Lieu à préciser'"></span> •
                <span th:text="${e.dateDebut} ?: 'Date à préciser'"></span>
              </div>
            </div>
            <span class="badge text-white badge-grad" th:text="${e.categorie} ?: 'Catégorie'"></span>
          </div>
          <p class="small mt-2" th:text="${#strings.abbreviate(e.description, 140)}"></p>

          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary btn-scale w-100" th:href="@{/organisateur/events/{id}/edit(id=${e.eid})}">Modifier</a>
            <a class="btn btn-outline-dark btn-scale w-100" th:href="@{/organisateur/events/{id}/participants(id=${e.eid})}">Participants</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
