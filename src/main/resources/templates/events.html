<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Événements • Gestion Événements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Liste des événements</h1>
    <a class="btn btn-outline-primary btn-scale" th:href="@{/}">Retour</a>
  </div>

  <div class="row g-3">
    <div class="col-md-4" th:each="ev : ${events}">
      <div class="card card-hover h-100">
        <div class="ratio ratio-16x9 bg-light">
          <img th:if="${ev.afficheUrl != null}" th:src="${ev.afficheUrl}" class="w-100 h-100" style="object-fit:cover;" alt="Affiche"/>
        </div>
        <div class="card-body">
          <div class="fw-semibold" th:text="${ev.titre}">Titre</div>
          <div class="small text-muted">
            <span th:text="${ev.lieu} ?: 'Lieu à préciser'">Lieu</span> •
            <span th:text="${ev.dateDebut} ?: 'Date à préciser'">Date</span>
          </div>
          <p class="small mt-2" th:text="${#strings.abbreviate(ev.description, 120)}">Desc</p>
        </div>
        <div class="card-footer bg-white border-0 pt-0">
          <a class="btn btn-primary btn-scale w-100" th:href="@{/events/{id}(id=${ev.eid})}">Détails</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
