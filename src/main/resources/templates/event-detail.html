<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="'Détail • ' + ${event.titre}">Détail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-4">
  <a class="btn btn-outline-secondary btn-scale mb-3" th:href="@{/events}">← Retour</a>

  <div class="card border-0 shadow-sm overflow-hidden">
    <div class="ratio ratio-21x9 bg-light">
      <img th:if="${event.afficheUrl != null}" th:src="${event.afficheUrl}" class="w-100 h-100" style="object-fit:cover;" alt="Affiche"/>
    </div>
    <div class="card-body p-4">
      <div class="d-flex justify-content-between flex-wrap gap-2 align-items-start">
        <div>
          <h1 class="h4 fw-bold mb-1" th:text="${event.titre}">Titre</h1>
          <div class="text-muted small">
            <span class="me-2">📍 <span th:text="${event.lieu} ?: 'Lieu à préciser'"></span></span>
            <span>🗓️ <span th:text="${event.dateDebut} ?: 'Date à préciser'"></span></span>
          </div>
        </div>
        <span class="badge text-white badge-grad" th:text="${event.categorie} ?: 'Catégorie'">Catégorie</span>
      </div>

      <hr/>
      <h2 class="h6 fw-bold">Description</h2>
      <p class="mb-4" th:text="${event.description}">Desc</p>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="p-3 border rounded-4">
            <h3 class="h6 fw-bold">Participer</h3>
            <form th:action="@{/events/{id}/participer(id=${event.eid})}" method="post" th:object="${participant}">
              <div class="row g-2">
                <div class="col-md-6">
                  <input class="form-control" placeholder="Nom" th:field="*{nom}" required/>
                </div>
                <div class="col-md-6">
                  <input class="form-control" placeholder="Prénom" th:field="*{prenom}" required/>
                </div>
                <div class="col-md-6">
                  <input class="form-control" placeholder="Email" th:field="*{email}" type="email" required/>
                </div>
                <div class="col-md-6">
                  <input class="form-control" placeholder="Téléphone" th:field="*{telephone}"/>
                </div>
                <div class="col-12">
                  <textarea class="form-control" placeholder="Message" th:field="*{message}" rows="3"></textarea>
                </div>
              </div>
              <button class="btn btn-primary btn-scale w-100 mt-3" type="submit">Participer</button>
              <div th:if="${param.okParticipation}" class="small text-success mt-2">Participation envoyée ✅</div>
            </form>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="p-3 border rounded-4">
            <h3 class="h6 fw-bold">Questions / Réponses</h3>

            <form th:action="@{/events/{id}/question(id=${event.eid})}" method="post" th:object="${question}">
              <div class="mb-2">
                <input class="form-control" placeholder="Votre nom" th:field="*{auteurNom}" required/>
              </div>
              <div class="mb-2">
                <textarea class="form-control" placeholder="Votre question" th:field="*{contenu}" rows="3" required></textarea>
              </div>
              <button class="btn btn-outline-primary btn-scale w-100" type="submit">Envoyer la question</button>
              <div th:if="${param.okQuestion}" class="small text-success mt-2">Question envoyée ✅</div>
            </form>

            <hr class="my-3"/>

            <div class="vstack gap-3">
              <div class="p-3 bg-light rounded-4" th:each="q : ${questions}">
                <div class="small text-muted">
                  <span class="fw-semibold" th:text="${q.auteurNom}">Auteur</span>
                  • <span th:text="${q.dateQuestion}">date</span>
                </div>
                <div class="mt-1" th:text="${q.contenu}">contenu</div>

                <div class="mt-2" th:if="${q.reponse != null}">
                  <div class="small text-muted">Réponse</div>
                  <div th:text="${q.reponse}"></div>
                </div>

                <div class="mt-2" th:if="${q.reponse == null}" sec:authorize="hasRole('RESPONSABLE')">
                  <form th:action="@{/admin/questions/{id}/repondre(id=${q.qid})}" method="post" class="d-flex gap-2">
                    <input class="form-control" name="reponse" placeholder="Répondre…" required/>
                    <button class="btn btn-dark btn-scale" type="submit">OK</button>
                  </form>
                </div>
              </div>
              <div class="small text-muted" th:if="${#lists.isEmpty(questions)}">Aucune question pour le moment.</div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
