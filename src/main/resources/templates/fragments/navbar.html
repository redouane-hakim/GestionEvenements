<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">Gestion Événements</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
            aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" th:href="@{/events}">Événements</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/about}">à propos</a></li>
      </ul>

      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-scale"
           th:href="@{/login}"
           sec:authorize="isAnonymous()">Login</a>

        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
          <button type="submit" class="btn btn-outline-secondary btn-scale">Logout</button>
        </form>
      </div>

    </div>
  </div>
</nav>
</body>
</html>
